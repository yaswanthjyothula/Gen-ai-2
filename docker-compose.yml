version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crimenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crimenet_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: crimenet_x
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimenet_admin -d crimenet_x"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.19-community
    container_name: crimenet-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/investigation_secure_pass
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimenet-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://crimenet_admin:secret_password@postgres:5432/crimenet_x
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: investigation_secure_pass
      SECRET_KEY: crimenet-x-secret-key-production-change-me-32chars
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crimenet-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
